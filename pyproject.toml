[tool.poetry]
name = "pypsps"
version = "0.4.0"
description = "Predictive State Propensity Subclassification (PSPS) in Python (keras)"
authors = ["Georg M. Goerg <im@gmge.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/gmgeorg/pypsps.git"

[tool.poetry.dependencies]
python = ">=3.12,<4.0.0"

numpy = ">=1.11.0"
pandas = ">=1.0.0"
tensorflow = ">=2.16"
tqdm = ">=4.62"
pypress = { git = "https://github.com/gmgeorg/pypress.git", rev = "v0.3.2" }

[tool.poetry.group.dev.dependencies]
flake8 = "^7.0.0"
pre-commit = "^3.7.0"
pytest = ">=6.1.1"
ruff = "^0.3.7"
seaborn = "^0.13.2"
scikit-learn = "^1.6.1"
optuna = "^4.2.1"
pydot = "^3.0.4"
scikit-survival = "^0.24.0"
# Reference implementation in test_neglogliks.py only; pypsps itself never imports it.
# TFP needs tf-keras, which its [tf] extra installs.
tensorflow-probability = { version = ">=0.24", extras = ["tf"] }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
# Every function argument in the library carries a type annotation.
extend-select = ["ANN001", "ANN002", "ANN003"]

[tool.ruff.lint.per-file-ignores]
"pypsps/tests/*" = ["ANN001", "ANN002", "ANN003"]

[tool.pytest.ini_options]
# A deprecated pypsps call in the suite fails it; tests of deprecations catch the warning.
filterwarnings = ["error::FutureWarning"]

[tool.isort]
# Match ruff-format, so the two hooks agree on long imports.
profile = "black"
line_length = 100
